name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:          # allows manual runs

env:
  IMAGE_NAME: ghcr.io/alleyway/hassio-addon-ntopng
  ARCHITECTURES: '["amd64","aarch64"]'   # match your config.yaml

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0  # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write          # needed for Cosign signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.09.0  # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name || github.ref_name }}
            latest
          version: ${{ github.event.release.tag_name || github.ref_name }}
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ''
